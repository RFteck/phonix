<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Fhinix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff7a1a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff3c9'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Layout: one fixed canvas holds the phoenix. Intro layer centers it under a title; the console layer sends it to a small slot beside a chat and a private diary, Jarvis style. */
  :root {
    --bg: #07060a;
    --ink: #ffeccb;
    --gold: #ffc65a;
    --ember: #ff7a1a;
    --crimson: #e0301e;
    --cool: #6fd8ff;
    --dim: rgba(255, 206, 140, 0.64);
    --faint: rgba(255, 206, 140, 0.4);
    --line: rgba(255, 190, 90, 0.28);
    --glass: rgba(16, 10, 9, 0.68);
    --display: 'Orbitron', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 14px;
    overflow: hidden; position: relative;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font: inherit; color: inherit; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse at 50% 38%, transparent 42%, rgba(0, 0, 0, 0.6) 100%),
      repeating-linear-gradient(0deg, rgba(255, 200, 120, 0.03) 0 1px, transparent 1px 3px);
  }
  .app { position: relative; z-index: 2; height: 100%; }
  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.7s ease, visibility 0.7s; }
  .layer.off { opacity: 0; visibility: hidden; pointer-events: none; }
  .console { display: block; }
  .caption {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 4; text-align: center;
    top: calc(env(safe-area-inset-top, 0px) + 58px); max-width: min(92vw, 640px); padding: 6px 14px;
    font: 500 15px/1.35 var(--body); color: var(--cool); background: rgba(8, 14, 18, 0.74); border: 1px solid rgba(111, 216, 255, 0.35);
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .caption.on { opacity: 1; }

  /* ---------- intro ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 14px; }
  .tag { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.22em; color: var(--dim); min-width: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); animation: blink 1.6s ease-in-out infinite; flex: none; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .clock { text-align: right; min-width: 0; }
  .clk { font-size: 20px; color: var(--gold); letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
  .dt { font-size: 11px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
  .boot { position: absolute; left: 0; top: 96px; margin: 0; padding: 0; list-style: none; font-size: 11.5px; line-height: 1.8; color: var(--dim); }
  .boot li { opacity: 0; transform: translateX(-6px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .boot li.on { opacity: 1; transform: none; }
  .boot li:last-child { color: var(--gold); }
  .hero { display: grid; justify-items: center; gap: 14px; text-align: center; margin-top: auto; padding-bottom: max(28px, 20px); }
  .logo {
    margin: 0; display: flex; justify-content: center;
    font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 11vw, 5rem); line-height: 1;
    filter: drop-shadow(0 0 18px rgba(255, 120, 30, 0.55));
  }
  .logo span {
    display: inline-block; padding: 0 0.1em;
    background: linear-gradient(180deg, #fff6df 0%, #ffc65a 52%, #f0511d 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(22px) scale(1.15); filter: blur(14px);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.9s ease;
    transition-delay: calc(var(--i) * 90ms);
  }
  .logo.on span { opacity: 1; transform: none; filter: none; }
  .tagline { margin: 0; font-size: clamp(12px, 3.2vw, 15px); letter-spacing: 0.14em; color: var(--dim); opacity: 0; transition: opacity 1.2s ease; }
  .tagline.on { opacity: 1; }
  .actions { min-height: 44px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .hint { margin: 0; min-height: 1.4em; font-size: 12px; letter-spacing: 0.1em; color: var(--faint); max-width: 92vw; }
  .btn {
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer;
    padding: 11px 22px; color: var(--gold); background: rgba(255, 160, 50, 0.06);
    border: 1px solid var(--line); border-radius: 0;
    transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover { background: rgba(255, 160, 50, 0.14); border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 130, 30, 0.35); }
  .btn:focus-visible, .sbtn:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .btn-main { color: #1a0c04; background: linear-gradient(180deg, #ffd777, #ff9a2e); border-color: #ffd777; font-weight: 700; box-shadow: 0 0 22px rgba(255, 140, 30, 0.45); }
  .btn-main:hover { background: linear-gradient(180deg, #ffe39a, #ffab4d); box-shadow: 0 0 30px rgba(255, 150, 40, 0.6); }
  .btn-ghost { border-color: transparent; color: var(--dim); background: transparent; }
  .btn[aria-pressed="true"] { border-color: var(--cool); color: var(--cool); box-shadow: 0 0 18px rgba(111, 216, 255, 0.3); }

  /* ---------- console ---------- */
  .cwrap { height: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; }
  .chead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; flex-wrap: wrap; }
  .brandrow { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand {
    font-family: var(--display); font-weight: 800; letter-spacing: 0.22em; font-size: 15px;
    background: linear-gradient(180deg, #fff6df, #ffc65a 60%, #f0511d); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.2em; color: var(--dim); }
  .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); flex: none; }
  .pill[data-s="standby"] .pdot { animation: blink 2.4s ease-in-out infinite; }
  .pill[data-s="thinking"] { color: var(--cool); }
  .pill[data-s="thinking"] .pdot { background: var(--cool); box-shadow: 0 0 10px var(--cool); animation: blink 0.7s ease-in-out infinite; }
  .pill[data-s="listening"] { color: #ff8a6a; }
  .pill[data-s="listening"] .pdot { background: var(--crimson); box-shadow: 0 0 10px var(--crimson); animation: blink 0.9s ease-in-out infinite; }
  .pill[data-s="speaking"] .pdot { animation: blink 0.5s ease-in-out infinite; }
  .cright { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .sbtn {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
    padding: 7px 12px; background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 0;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .sbtn:hover { border-color: var(--gold); color: var(--gold); }
  .sbtn[aria-pressed="true"] { border-color: var(--gold); color: #1a0c04; background: var(--gold); }
  .grid {
    flex: 1; min-height: 0; display: grid; gap: 16px; padding-bottom: 16px;
    grid-template-columns: minmax(220px, 300px) minmax(0, 1fr) minmax(260px, 330px);
  }
  .col-core { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
  .core-slot { width: 100%; aspect-ratio: 1 / 0.95; max-height: 46vh; }
  .readouts { margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
  .readouts div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid rgba(255, 190, 90, 0.12); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
  .readouts dt { color: var(--faint); }
  .readouts dd { margin: 0; color: var(--gold); font-variant-numeric: tabular-nums; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: var(--body); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; cursor: pointer; white-space: nowrap;
    padding: 7px 12px; background: rgba(255, 160, 50, 0.07); color: var(--ink); border: 1px solid var(--line); border-radius: 0;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .chip:hover { background: rgba(255, 160, 50, 0.16); border-color: var(--gold); }

  .panel {
    position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .panel::before, .panel::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--gold); pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; }
  .phead .sbtn { padding: 5px 10px; }
  .pact { display: flex; gap: 6px; }

  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: min(100%, 660px); min-width: 0; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg .meta { font-size: 11px; letter-spacing: 0.16em; color: var(--faint); margin-bottom: 5px; }
  .msg.user .meta { color: rgba(111, 216, 255, 0.75); }
  .msg .body { font-family: var(--body); font-weight: 500; font-size: 17px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .body { color: #d6f1ff; }
  .msg.sys .body { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.04em; color: var(--dim); }
  .msg.pending .body::after { content: "Processando"; font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; color: var(--cool); text-transform: uppercase; animation: dots 1.2s steps(1) infinite; }
  @keyframes dots { 0% { content: "Processando"; } 25% { content: "Processando."; } 50% { content: "Processando.."; } 75% { content: "Processando..."; } }
  .act { margin-top: 6px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .act:hover { color: var(--gold); }
  .act:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; min-width: 0; resize: none; background: rgba(0, 0, 0, 0.38); border: 1px solid var(--line); color: var(--ink);
    font: 500 16px/1.4 var(--body); padding: 10px 12px; border-radius: 0; max-height: 120px;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .composer .btn { padding: 0 16px; height: 44px; flex: none; }

  .memform { display: grid; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  .memform .btn { justify-self: end; padding: 8px 16px; }
  .memnote { margin: 0; padding: 8px 14px 0; font-size: 12px; letter-spacing: 0.04em; color: var(--dim); }
  .memnote:empty { display: none; }
  .mem { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
  .mem li { padding: 12px 14px; border-bottom: 1px solid rgba(255, 190, 90, 0.12); display: grid; gap: 6px; }
  .mem time { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; }
  .mem p { margin: 0; font: 500 16px/1.4 var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
  .mem .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .mem .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .mem .t { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cool); border: 1px solid rgba(111, 216, 255, 0.35); padding: 2px 6px; }
  .mem .empty { color: var(--dim); font: 500 15px/1.45 var(--body); display: block; }
  .mem .empty .sbtn { margin-top: 10px; }
  .del { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; background: none; border: 0; color: var(--faint); cursor: pointer; padding: 4px 0; }
  .del:hover, .del[data-armed="1"] { color: #ff8a6a; }
  .del:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- painel (palmas, Spotify, Google, resumo) ---------- */
  .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .vtoggle { display: flex; gap: 6px; }
  .hubroot { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 14px; display: grid; gap: 12px; align-content: start; }
  .hrows { display: grid; }
  .hrow { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(255, 190, 90, 0.12); font-size: 12px; letter-spacing: 0.08em; }
  .hl { color: var(--faint); text-transform: uppercase; letter-spacing: 0.16em; }
  .hv { color: var(--gold); min-width: 0; overflow-wrap: anywhere; }
  .hmeter { position: relative; height: 8px; background: rgba(255, 190, 90, 0.1); border: 1px solid var(--line); }
  .hbar { height: 100%; width: 0; background: linear-gradient(90deg, var(--ember), var(--gold)); }
  .hmark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--cool); left: 20%; }
  .hsens { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .hsel { width: 100%; background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid var(--line); padding: 5px 6px; font: 500 14px var(--body); border-radius: 0; }
  .hsens input { width: 100%; accent-color: var(--gold); }
  .hnote { font-size: 11px; letter-spacing: 0.08em; color: var(--dim); }
  .hnote:empty { display: none; }
  .hacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .hcards { display: grid; gap: 10px; }
  .hcard { border: 1px solid var(--line); padding: 10px 12px; background: rgba(0, 0, 0, 0.22); }
  .hcard h3 { margin: 0 0 6px; font: 600 11px var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
  .hcard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .hcard li { font: 500 15px/1.35 var(--body); display: grid; gap: 1px; overflow-wrap: anywhere; }
  .hcard li small { font: 11px var(--mono); letter-spacing: 0.08em; color: var(--faint); }
  .hcard a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--line); }
  .hcard a:hover { color: var(--gold); }

  .tabs { display: none; gap: 8px; padding: 0 0 10px; }
  .tab { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; padding: 11px; background: transparent; border: 1px solid var(--line); color: var(--dim); cursor: pointer; border-radius: 0; }
  .tab[aria-selected="true"] { color: #1a0c04; background: var(--gold); border-color: var(--gold); }

  @media (max-width: 999px) {
    .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-bottom: 8px; }
    .col-core { gap: 8px; }
    .core-slot { aspect-ratio: auto; height: 128px; max-height: none; }
    .readouts { display: none; }
    .quick { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .col-mem { display: none; }
    .cwrap[data-tab="mem"] .col-chat { display: none; }
    .cwrap[data-tab="mem"] .col-mem { display: flex; }
    .cwrap[data-tab="mem"] .quick { display: none; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .vtoggle { display: none; }
    .chead .clock { display: none; }
  }
  @media (max-width: 520px) {
    .brandrow { gap: 8px; }
    .pill { letter-spacing: 0.12em; }
    .sbtn { padding: 7px 9px; letter-spacing: 0.1em; }
    .cright { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo span, .tagline, .boot li, .layer { transition: none; }
    .dot, .pdot, .msg.pending .body::after { animation: none; }
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="caption" id="caption" aria-live="polite"></div>

<div class="app" id="app">
  <section class="layer intro" id="intro" aria-label="Abertura">
    <header class="top">
      <div class="tag"><span class="dot"></span><span>FHINIX · ASSISTENTE PESSOAL</span></div>
      <div class="clock"><div class="clk" data-clk>--:--:--</div><div class="dt" data-dt></div></div>
    </header>
    <ol class="boot" id="boot" aria-live="polite"></ol>
    <section class="hero">
      <h1 class="logo" id="logo" aria-label="Fhinix">
        <span aria-hidden="true" style="--i:0">F</span><span aria-hidden="true" style="--i:1">H</span><span aria-hidden="true" style="--i:2">I</span><span aria-hidden="true" style="--i:3">N</span><span aria-hidden="true" style="--i:4">I</span><span aria-hidden="true" style="--i:5">X</span>
      </h1>
      <p class="tagline" id="tagline">Assistente pessoal e diário privado.</p>
      <div class="actions">
        <button class="btn" id="skip" type="button">Pular</button>
        <button class="btn btn-main" id="voiceStart" type="button" aria-pressed="false" hidden>Ativar voz</button>
        <button class="btn" id="start" type="button" hidden>Iniciar</button>
        <button class="btn btn-ghost" id="replay" type="button" hidden>Ver de novo</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>
  </section>

  <section class="layer console off" id="console" inert aria-label="Console do Fhinix">
    <div class="cwrap" id="cwrap" data-tab="chat">
      <header class="chead">
        <div class="brandrow">
          <span class="brand">FHINIX</span>
          <span class="pill" id="pill" data-s="idle"><span class="pdot"></span><span id="stateTxt">ONLINE</span></span>
        </div>
        <div class="cright">
          <div class="clock"><div class="clk" data-clk style="font-size:15px">--:--:--</div></div>
          <button class="sbtn" id="listenBtn" type="button" aria-pressed="false" title="Ativação por voz: diga Fhinix" hidden>Escuta</button>
          <button class="sbtn" id="voiceBtn" type="button" aria-pressed="false" title="O Fhinix responde em voz alta" hidden>Voz</button>
          <button class="sbtn" id="clapBtn" type="button" aria-pressed="false" title="Duas palmas: música + resumo do dia" hidden>Palmas</button>
          <button class="sbtn" id="introBtn" type="button">Abertura</button>
          <button class="sbtn" id="authBtn" type="button" hidden>Entrar</button>
        </div>
      </header>

      <div class="grid">
        <aside class="col-core">
          <div class="core-slot" id="coreSlot" aria-hidden="true"></div>
          <dl class="readouts">
            <div><dt>Sistema</dt><dd id="rdSys">Online</dd></div>
            <div><dt>Memórias</dt><dd id="rdMem">0</dd></div>
            <div><dt>Núcleo</dt><dd id="rdMode">Local</dd></div>
          </dl>
          <div class="quick" id="quick"></div>
        </aside>

        <section class="panel col-chat" aria-label="Conversa">
          <div class="phead">
            <span>Conversa</span>
            <div class="pact">
              <button class="sbtn" id="modeBtn" type="button" aria-pressed="false" title="Baixa e ativa a IA de conversação que roda neste aparelho">IA local</button>
              <button class="sbtn" id="clearBtn" type="button">Limpar</button>
            </div>
          </div>
          <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Fale com o Fhinix…" aria-label="Mensagem para o Fhinix"></textarea>
            <button class="btn" id="stopBtn" type="button" hidden>Parar</button>
            <button class="btn btn-main" id="sendBtn" type="submit">Enviar</button>
          </form>
        </section>

        <aside class="panel col-mem" aria-label="Memórias">
          <div class="phead">
            <div class="vtoggle">
              <button class="sbtn" id="vHub" type="button" aria-pressed="true">Painel</button>
              <button class="sbtn" id="vMem" type="button" aria-pressed="false">Memórias</button>
            </div>
            <span id="memCount">0</span>

<script>
/* ===== brain ===== */
/* Fhinix · núcleo independente.
 * Tudo roda no navegador: sem servidor, sem chave de API, sem serviço de terceiros.
 *  - Camada 1: habilidades locais (hora, cálculo, lembretes, diário, conversões...). Instantâneas e offline.
 *  - Camada 2: IA de linguagem opcional (WebLLM), baixada uma vez e executada na GPU do próprio aparelho.
 */
(function () {
  'use strict';

  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pad = (n) => String(n).padStart(2, '0');
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ---------- números por extenso (0 a 99) ---------- */
  const UNITS = { zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, quatorze: 14, catorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19 };
  const TENS = { vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 };
  function wordsToDigits(s) {
    return s.replace(/\b(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)(?:\s+e\s+(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove))?\b/g, (_, t, u) => String(TENS[t] + (u ? UNITS[u] : 0)))
      .replace(/\b(zero|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove)\b/g, (w) => String(UNITS[w]));
  }
  function fmtNum(x) {
    if (!isFinite(x)) return 'indefinido';
    const r = Math.round(x * 1e6) / 1e6;
    return r.toLocaleString('pt-BR', { maximumFractionDigits: 6 });
  }

  /* ---------- calculadora segura (sem eval) ---------- */
  function calc(expr) {
    const toks = expr.match(/\d+(?:\.\d+)?|[()+\-*/^%]|sqrt/g);
    if (!toks || toks.join('').length < expr.replace(/\s/g, '').length) return null;
    let i = 0;
    const peek = () => toks[i];
    function primary() {
      const t = toks[i++];
      if (t === undefined) throw 0;
      if (t === '(') { const v = add(); if (toks[i++] !== ')') throw 0; return v; }
      if (t === '-') return -unary();
      if (t === '+') return unary();
      if (t === 'sqrt') return Math.sqrt(unary());
      if (/^\d/.test(t)) return parseFloat(t);
      throw 0;
    }
    function unary() { return primary(); }
    function pow() { let b = unary(); if (peek() === '^') { i++; b = Math.pow(b, pow()); } return b; }
    function mul() {
      let v = pow();
      while (peek() === '*' || peek() === '/' || peek() === '%') {
        const o = toks[i++]; const r = pow();
        v = o === '*' ? v * r : o === '/' ? v / r : v % r;
      }
      return v;
    }
    function add() {
      let v = mul();
      while (peek() === '+' || peek() === '-') { const o = toks[i++]; const r = mul(); v = o === '+' ? v + r : v - r; }
      return v;
    }
    try { const v = add(); return i === toks.length ? v : null; } catch (_) { return null; }
  }
  function mathFrom(n) {
    let s = wordsToDigits(n);
    const pc = /(\d+(?:,\d+)?)\s*(?:%|por cento)\s*de\s*(\d+(?:,\d+)?)/.exec(s);
    if (pc) return parseFloat(pc[1].replace(',', '.')) / 100 * parseFloat(pc[2].replace(',', '.'));
    s = s.replace(/raiz (?:quadrada )?de\s*(\d+(?:,\d+)?)/g, 'sqrt($1)')
      .replace(/(\d)\s*,\s*(\d)/g, '$1.$2')
      .replace(/elevado a(?: potencia)?|\bao quadrado\b/g, (m) => (m === 'ao quadrado' ? '^2' : '^'))
      .replace(/\bmais\b/g, '+').replace(/\bmenos\b/g, '-')
      .replace(/\bvezes\b|\bmultiplicado por\b|(\d)\s*x\s*(?=\d)/g, (m, d) => (d ? d + '*' : '*'))
      .replace(/\bdividido por\b|\bdividido\b|\bsobre\b/g, '/');

  /* ---------- duração e datas ---------- */
  const UNIT_MS = { segundo: 1000, minuto: 60000, hora: 3600000 };
  function parseDuration(n) {
    const s = wordsToDigits(n).replace(/meia hora/g, '30 minutos').replace(/uma hora e meia/g, '90 minutos').replace(/(\d+) e meia hora/g, (_, h) => String(h * 60 + 30) + ' minutos');
    let total = 0, found = false;
    const re = /(\d+(?:[.,]\d+)?)\s*(segundos?|seg|minutos?|min|horas?|h)\b/g;
    let m;
    while ((m = re.exec(s))) {
      const v = parseFloat(m[1].replace(',', '.'));
      const u = m[2][0] === 's' ? 'segundo' : m[2][0] === 'm' ? 'minuto' : 'hora';

  }
  function humanDur(ms) {
    const s = Math.round(ms / 1000);

    if (m < 60) return m + (m === 1 ? ' minuto' : ' minutos') + (r ? ' e ' + r + ' s' : '');

    return h + (h === 1 ? ' hora' : ' horas') + (mm ? ' e ' + mm + ' min' : '');
  }
  const FESTAS = { natal: [11, 25], 'ano novo': [0, 1], 'dia dos namorados': [5, 12], tiradentes: [3, 21], 'independencia': [8, 7], 'dia das criancas': [9, 12], halloween: [9, 31] };
  function nextDate(day, month, year) {
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    if (!year && d < today) d = new Date(now.getFullYear() + 1, month, day);

  function daysUntil(n) {
    let target = null, label = '';
    for (const k of Object.keys(FESTAS)) if (n.includes(k)) { target = nextDate(FESTAS[k][1], FESTAS[k][0]); label = k; }
    const m = /(\d{1,2})\s*(?:\/|de)\s*(\d{1,2}|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s*(?:\/|de)\s*(\d{4}))?/.exec(n);
    if (!target && m) {
      const MES = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      const mon = /^\d+$/.test(m[2]) ? parseInt(m[2], 10) - 1 : MES.indexOf(m[2]);
      const day = parseInt(m[1], 10);
      if (mon < 0 || mon > 11 || day < 1 || day > 31) return null;
      target = nextDate(day, mon, m[3] ? parseInt(m[3], 10) : 0);
      label = pad(day) + '/' + pad(mon + 1) + (m[3] ? '/' + m[3] : '');
    }
    if (!target) return null;
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const d = Math.round((target - today) / 86400000);
    if (d === 0) return 'É hoje.';
    if (d < 0) return 'Essa data foi há ' + (-d) + (d === -1 ? ' dia.' : ' dias.');
    return d === 1 ? 'Falta 1 dia para ' + label + '.' : 'Faltam ' + d + ' dias para ' + label + '.';
  }

  /* ---------- conversões ---------- */
  function convert(n) {
    const s = wordsToDigits(n).replace(/(\d),(\d)/g, '$1.$2');
    let m = /(-?\d+(?:\.\d+)?)\s*(?:km|quilometros?)\b.*\b(?:em|para|pra)\s+milhas?/.exec(s);
    if (m) return fmtNum(m[1] * 0.621371) + ' milhas.';
    m = /(-?\d+(?:\.\d+)?)\s*milhas?\b.*\b(?:em|para|pra)\s+(?:km|quilometros?)/.exec(s);
    if (m) return fmtNum(m[1] * 1.609344) + ' quilômetros.';
    m = /(-?\d+(?:\.\d+)?)\s*(?:kg|quilos?|quilogramas?)\b.*\b(?:em|para|pra)\s+(?:libras?|lb)/.exec(s);
    if (m) return fmtNum(m[1] * 2.204623) + ' libras.';
    m = /(-?\d+(?:\.\d+)?)\s*(?:libras?|lb)\b.*\b(?:em|para|pra)\s+(?:kg|quilos?)/.exec(s);
    if (m) return fmtNum(m[1] * 0.453592) + ' quilos.';
    m = /(-?\d+(?:\.\d+)?)\s*(?:graus?\s*)?(?:celsius|c)\b.*\b(?:em|para|pra)\s+(?:fahrenheit|f)\b/.exec(s);
    if (m) return fmtNum(m[1] * 9 / 5 + 32) + ' graus Fahrenheit.';
    m = /(-?\d+(?:\.\d+)?)\s*(?:graus?\s*)?(?:fahrenheit|f)\b.*\b(?:em|para|pra)\s+(?:celsius|c)\b/.exec(s);
    if (m) return fmtNum((m[1] - 32) * 5 / 9) + ' graus Celsius.';
    m = /(-?\d+(?:\.\d+)?)\s*(?:metros?|m)\b.*\b(?:em|para|pra)\s+(?:pes|ft)\b/.exec(s);

  }

  /* ---------- diário: busca simples por palavras ---------- */
  const STOP = new Set('a o as os um uma de do da dos das em no na nos nas por para pra com sobre que eu meu minha meus minhas tem tenho algo alguma qualquer coisa anotei anotado nas nos memoria memorias diario procure procurar busque buscar ache achar encontre e ou ao aos se foi era ser'.split(' '));
  function searchDiary(entries, q) {
    const words = norm(q).split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !STOP.has(w));

      const hay = norm((e.texto || '') + ' ' + (Array.isArray(e.tags) ? e.tags.join(' ') : ''));
      let sc = 0; words.forEach((w) => { if (hay.includes(w)) sc++; });

  }
  const cut = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

    const d = new Date(ts || Date.now());
    const today = new Date(); const y = new Date(); y.setDate(y.getDate() - 1);
    const same = (a, b) => a.toDateString() === b.toDateString();

  /* ---------- fábrica ---------- */
  function create(api) {
    const reminders = []; // { id, at, text, timer }
    let pending = null;   // próxima mensagem tem destino especial (ex.: texto de uma anotação)
    let seq = 0;

    function addReminder(ms, text) {
      const id = ++seq; const at = Date.now() + ms;
      const timer = setTimeout(() => {
        const i = reminders.findIndex((r) => r.id === id); if (i >= 0) reminders.splice(i, 1);
        api.notify(text ? 'Lembrete: ' + text + '.' : 'Seu tempo acabou.');
      }, ms);

    }

      if (!reminders.length) return 'Não há lembretes ativos.';
      return reminders.slice().sort((a, b) => a.at - b.at).map((r) => 'Em ' + humanDur(Math.max(0, r.at - Date.now())) + (r.text ? ': ' + r.text : ': timer')).join('. ') + '.';
    }

      'Também faço o resumo do dia (música, notícias, agenda e e-mails importantes), toco e controlo o Spotify. Bata duas palmas para começar. ' +

    async function reply(text) {

      if (!n) return null;

      if (pending === 'note') {

        if (/^(cancela|cancelar|deixa|esquece|nada)\b/.test(n)) return 'Tudo bem, não anotei nada.';

      }

      if (/\b(dorme|dormir|tchau|ate logo|encerrar|desativar|silencio)\b/.test(n)) { api.sleep(); return 'Até logo. Me chame quando precisar.'; }

      /* nome */
      let m = /\b(?:me chame de|pode me chamar de|meu nome e|me chamo)\s+([a-z' -]{2,30})$/.exec(n);
      if (m) {
        const nome = raw.slice(raw.toLowerCase().lastIndexOf(m[1].split(' ')[0])).trim().replace(/[.!]+$/, '');
        const clean = nome.replace(/^./, (c) => c.toUpperCase());

      if (/\bque horas\b|\bhoras sao\b|\bhora certa\b|\bme (?:diga|fala|fale) as horas\b/.test(n)) {

      }

        return 'Hoje é ' + new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.';
      }
      if (/\bquantos dias\b.*\b(faltam|falta|restam|para)\b|\bfaltam quantos dias\b/.test(n)) {

      }

      if (/\b(cancel\w+|apag\w+|limp\w+|remov\w+)\b.*\b(lembretes?|timers?|alarmes?)\b/.test(n)) { const c = clearReminders(); return c ? 'Cancelei ' + c + (c === 1 ? ' lembrete.' : ' lembretes.') : 'Não havia nada para cancelar.'; }
      if (/\b(quais|meus|tenho|listar|liste|ver)\b.*\b(lembretes?|timers?|alarmes?)\b/.test(n)) return listReminders();
      m = /\b(?:me lembre|me lembra|lembre-me|lembrar-me|me avise|me avisa|avise-me)\b\s*(?:daqui a|em|dentro de)?\s*(.*)/.exec(n);
      const isTimer = /\b(?:timer|cronometro|alarme|temporizador)\b/.test(n);
      if (m || isTimer) {
        const ms = parseDuration(n);
        if (ms >= 1000 && ms <= 24 * 3600000) {
          let what = '';
          const w = /\b(?:de|para|pra|que)\s+(.+?)(?:\s+(?:daqui a|em|dentro de)\s+\d.*)?$/.exec(m ? m[1].replace(/^\d+(?:[.,]\d+)?\s*(?:segundos?|seg|minutos?|min|horas?|h)\b(?:\s*e\s*\d+\s*(?:segundos?|minutos?|min))?\s*/, '') : '');

      if (/\bquantas (memorias|anotacoes)\b/.test(n)) { const c = api.entries().length; return c === 0 ? 'Seu diário está vazio.' : 'Você tem ' + c + (c === 1 ? ' memória guardada.' : ' memórias guardadas.'); }
      m = /\b(?:o que|oque)\s+(?:eu\s+)?anotei\s+(?:sobre|de|do|da|em)\s+(.+)|\b(?:procure|procurar|busque|buscar|ache|encontre|pesquise)\b.*?\b(?:sobre|por)\s+(.+)|\btenho (?:algo|alguma coisa|anotacao|memoria)\s+(?:sobre|de)\s+(.+)/.exec(n);
      if (m) {
        if (api.locked()) return 'Entre com sua conta Google para eu acessar o diário.';

(function () {

  /* =====================================================================

  class ClapDetector {
    constructor(o) { this.o = null; this.set(o); this.reset(); }

    async function call(method, path, body, query) {
      const url = 'https://api.spotify.com/v1' + path + (query ? '?' + new URLSearchParams(query).toString() : '');
      const r = await fetch(url, { method: method, headers: { Authorization: 'Bearer ' + (await token()), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      if (r.status === 204 || r.status === 202) return null;
      let j = null; try { j = await r.json(); } catch (_) { /* sem corpo */ }
      if (!r.ok) {
        const reason = (j && j.error && (j.error.reason || j.error.message)) || '';
        throw Object.assign(new Error(reason || 'http' + r.status), { status: r.status, reason: reason, spotify: true });
      }
      return j;
    }

    function loadSdk() {
      return new Promise((res, rej) => {
        if (window.Spotify) return res();
        window.onSpotifyWebPlaybackSDKReady = () => res();
        const s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js'; s.onerror = () => rej(new Error('sdk'));
        document.head.appendChild(s);
      });
    }
    async function initPlayer() {
      if (player || !tok) return;
      try {
        await loadSdk();
        player = new window.Spotify.Player({ name: scfg.nomeDoAparelho || 'Fhinix', getOAuthToken: (cb) => { token().then(cb).catch(() => {}); }, volume: 0.7 });
        player.addListener('ready', (d) => { webId = d.device_id; });
        player.addListener('not_ready', () => { webId = null; });
        player.addListener('account_error', () => { lastErr = 'premium'; api.addMsg('sys', 'O player do navegador exige Spotify Premium. Ainda dá para controlar o app do Spotify aberto em outro aparelho.'); });
        player.addListener('initialization_error', () => { lastErr = 'init'; });
        player.addListener('authentication_error', () => { lastErr = 'auth'; });
        player.addListener('autoplay_failed', () => { api.addMsg('sys', 'O navegador bloqueou o som automático. Toque uma vez na página e tente de novo.'); });
        await player.connect();
      } catch (_) { player = null; }
    }
    function prime() {
      if (!tok) return;
      initPlayer().then(() => { try { if (player && player.activateElement) player.activateElement(); } catch (_) { /* ignore */ } });
    }

    async function devices() { const j = await call('GET', '/me/player/devices'); return (j && j.devices) || []; }
    async function playOn(body) {
      try { await call('PUT', '/me/player/play', body); return; }
      catch (e) { if (e.status !== 404 && !/NO_ACTIVE_DEVICE/.test(e.reason || '')) throw e; }
      for (let i = 0; i < 6 && !webId; i++) { if (!player) break; await sleep(500); } // espera o player do navegador ficar pronto
      const list = await devices();
      const cand = [(list.find((d) => d.is_active) || {}).id, webId, (list[0] || {}).id].filter(Boolean);
      if (!cand.length) throw Object.assign(new Error('nodevice'), { spotify: true, nodevice: true });
      await call('PUT', '/me/player/play', body, { device_id: cand[0] });
    }
    const asUri = (s) => { const m = /open\.spotify\.com\/(playlist|album|artist)\/([A-Za-z0-9]+)/.exec(s || ''); return m ? 'spotify:' + m[1] + ':' + m[2] : (s || ''); };

    async function playConfig() {
      const uri = asUri(scfg.playlist);
      if (scfg.aleatorio !== false && uri) { try { await call('PUT', '/me/player/shuffle', null, { state: 'true' }); } catch (_) { /* sem aparelho ativo ainda */ } }
      await playOn(uri ? { context_uri: uri } : undefined);
    }
    async function search(q) {
      const hint = { playlist: /\bplaylist\b/.test(q), album: /\balbum\b/.test(q) };
      const qq = q.replace(/\b(a|o|as|os|um|uma|musica|cancao|playlist|album|do|da|de|banda|artista|no spotify|pra mim|para mim|ai)\b/g, ' ').replace(/\s+/g, ' ').trim() || q;
      const types = hint.playlist ? 'playlist' : hint.album ? 'album' : 'track,artist,playlist';
      const j = await call('GET', '/search', null, { q: qq, type: types, limit: '3' });
      const first = (k) => ((j[k] && j[k].items) || []).filter(Boolean)[0];
      const artist = first('artists'), track = first('tracks'), pl = first('playlists'), al = first('albums');
      if (hint.playlist && pl) return { name: pl.name, body: { context_uri: pl.uri } };
      if (hint.album && al) return { name: al.name, body: { context_uri: al.uri } };
      if (artist && (norm(artist.name).includes(norm(qq)) || norm(qq).includes(norm(artist.name))) && !track) return { name: artist.name, body: { context_uri: artist.uri } };
      if (track) return { name: track.name + ', de ' + track.artists.map((a) => a.name).join(' e '), body: { uris: [track.uri] } };
      if (artist) return { name: artist.name, body: { context_uri: artist.uri } };
      if (pl) return { name: pl.name, body: { context_uri: pl.uri } };
      return null;
    }
    async function playQuery(q) {
      const r = await search(q);
      if (!r) return null;
      await playOn(r.body);
      return r.name;
    }
    const state = () => call('GET', '/me/player');
    async function nowPlaying() {
      const j = await call('GET', '/me/player/currently-playing');
      if (!j || !j.item) return null;
      return { name: j.item.name, artists: (j.item.artists || []).map((a) => a.name).join(' e '), playing: !!j.is_playing };
    }
    const pause = () => call('PUT', '/me/player/pause').catch(() => {});
    const resume = () => playOn(undefined);
    const next = () => call('POST', '/me/player/next');
    const prev = () => call('POST', '/me/player/previous');
    const setVolume = (p) => call('PUT', '/me/player/volume', null, { volume_percent: String(Math.max(0, Math.min(100, Math.round(p)))) }).catch(() => {});
    async function changeVolume(delta) {
      const st = await state();
      const cur = st && st.device ? st.device.volume_percent : 50;
      const v = Math.max(0, Math.min(100, cur + delta));
      await call('PUT', '/me/player/volume', null, { volume_percent: String(v) });
      return v;
    }
    return {
      configured: configured, get connected() { return !!tok; }, get lastErr() { return lastErr; },
      connect: connect, disconnect: () => { save(null); if (player) { try { player.disconnect(); } catch (_) { /* ignore */ } player = null; } },
      handleRedirect: handleRedirect, prime: prime, playConfig: playConfig, playQuery: playQuery, nowPlaying: nowPlaying, state: state,
      pause: pause, resume: resume, next: next, prev: prev, setVolume: setVolume, changeVolume: changeVolume, _asUri: asUri
    };
  }

  /* =====================================================================
   *  Google (Gmail + Agenda), somente leitura, token do login do Firebase
   * ===================================================================== */
  function createGoogle(api, cfg) {
    async function gfetch(url) {
      const t = api.googleToken();
      if (!t) throw Object.assign(new Error('auth'), { auth: true });
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + t } });
      if (r.ok) return r.json();
      let msg = ''; try { msg = ((await r.json()).error || {}).message || ''; } catch (_) { /* ignore */ }
      if (r.status === 401) throw Object.assign(new Error('auth'), { auth: true });
      if (r.status === 403 && /has not been used|is disabled|accessNotConfigured/i.test(msg)) throw Object.assign(new Error('apioff'), { apiOff: true });
      if (r.status === 403) throw Object.assign(new Error('auth'), { auth: true, scope: true });
      throw new Error('http' + r.status);
    }
    async function emails() {
      const q = cfg.consultaGmail || 'is:unread in:inbox newer_than:2d';
      const list = await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=' + (cfg.analisar || 30) + '&q=' + encodeURIComponent(q));
      const ids = (list.messages || []).map((m) => m.id);
      const base = 'https://gmail.googleapis.com/gmail/v1/users/me/messages/';
      const got = await Promise.allSettled(ids.map((id) => gfetch(base + id + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=List-Unsubscribe')));
      const msgs = got.filter((g) => g.status === 'fulfilled').map((g) => normMsg(g.value));
      return triage(msgs, cfg);
    }
    async function agenda() {
      const now = new Date();
      const eod = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      const eot = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2, 0, 0, 0);
      const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=25&timeMin=' + encodeURIComponent(now.toISOString()) + '&timeMax=' + encodeURIComponent(eot.toISOString());
      const j = await gfetch(url);
      const evs = (j.items || []).filter((e) => e.status !== 'cancelled' && !((e.attendees || []).some((a) => a.self && a.responseStatus === 'declined'))).map((e) => {
        const allDay = !!(e.start && e.start.date && !e.start.dateTime);
        const start = new Date(e.start.dateTime || (e.start.date + 'T00:00:00'));
        const end = new Date(e.end && (e.end.dateTime || (e.end.date + 'T00:00:00')) || start);
        return { title: cut(e.summary || 'sem título', 90), start: start, end: end, allDay: allDay };
      }).filter((e) => e.allDay || e.end > now);
      return { hoje: evs.filter((e) => e.start < eod), amanha: evs.filter((e) => e.start >= eod) };
    }
    return { emails: emails, agenda: agenda };
  }
  function emailsText(r) {
    if (!r.keep.length) return 'Nenhum e-mail importante não lido nas últimas horas.' + (r.dropped ? ' Ignorei ' + r.dropped + ' ' + plural(r.dropped, 'automático ou promocional.', 'automáticos ou promocionais.') : '');
    const n = r.keep.length;
    return 'Você tem ' + n + ' ' + plural(n, 'e-mail importante.', 'e-mails importantes.') + ' ' +
      r.keep.map((m, i) => ORD[i] + ', de ' + cut(m.from, 40) + ': ' + cleanSubject(m.subject) + '.').join(' ') +
      (r.dropped ? ' Ignorei ' + r.dropped + ' ' + plural(r.dropped, 'automático ou promocional.', 'automáticos ou promocionais.') : '');
  }
  function agendaText(a) {
    const fmt = (e) => (e.allDay ? 'o dia todo, ' : 'às ' + spokenTime(e.start) + ', ') + e.title;
    const parts = [];
    if (a.hoje.length) {
      const first = a.hoje.find((e) => !e.allDay && e.start > new Date());
      const mins = first ? Math.round((first.start - Date.now()) / 60000) : null;
      if (mins != null && mins <= 60) parts.push('Atenção: seu próximo compromisso começa em ' + mins + ' ' + plural(mins, 'minuto.', 'minutos.'));
      parts.push('Hoje você tem ' + a.hoje.length + ' ' + plural(a.hoje.length, 'compromisso.', 'compromissos.') + ' ' + a.hoje.slice(0, 6).map((e) => fmt(e) + '.').join(' '));
    } else {
      parts.push('Você não tem mais compromissos hoje.');
    }
    if (a.amanha.length) parts.push('Amanhã: ' + a.amanha.slice(0, 3).map((e) => fmt(e) + '.').join(' '));
    return parts.join(' ');
  }

  /* =====================================================================
   *  Hub: painel, rotina e comandos de voz
   * ===================================================================== */
  function create(api) {
    const cfg = api.cfg || {};
    const sCfg = cfg.spotify || {}, pCfg = cfg.palmas || {}, rCfg = cfg.resumo || {}, nCfg = cfg.noticias || {};
    const sp = createSpotify(sCfg, api);
    const gg = createGoogle(api, rCfg);
    const SENS_KEY = 'fhinix.palmas.sens';
    let sens = +(function () { try { return localStorage.getItem(SENS_KEY); } catch (_) { return null; } })() || pCfg.sensibilidade || 5;
    const det = new ClapDetector(Object.assign({ count: pCfg.quantidade || 2 }, fromSens(sens)));
    let mic = null, running = false, aborted = false, clapCount = 0, lastUi = 0;
    const ui = {};

    /* ---------- painel ---------- */
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    function btn(label, fn, cls) { const b = el('button', cls || 'sbtn', label); b.type = 'button'; b.addEventListener('click', fn); return b; }
    function build() {
      const root = api.root; if (!root) return;
      root.replaceChildren();
      const rows = el('div', 'hrows');
      const row = (name) => { const r = el('div', 'hrow'); const l = el('span', 'hl', name); const v = el('span', 'hv'); const a = el('span', 'ha'); r.append(l, v, a); rows.appendChild(r); return { v: v, a: a }; };
      ui.sp = row('Spotify'); ui.gg = row('Google'); ui.cl = row('Palmas');
      if (api.listVoices) {
        const vr = row('Voz'); ui.voz = el('select', 'hsel'); ui.voz.setAttribute('aria-label', 'Voz do Fhinix');
        const fill = () => { const L = api.listVoices(); ui.voz.replaceChildren(); L.forEach((n) => { const o = el('option', null, n); o.value = n; ui.voz.appendChild(o); }); if (!L.length) ui.voz.appendChild(el('option', null, 'padrão do navegador')); ui.voz.value = api.currentVoice(); };
        fill(); setTimeout(fill, 1500); setTimeout(fill, 4000); // as vozes do navegador carregam com atraso
        ui.voz.addEventListener('change', () => api.setVoice(ui.voz.value));
        vr.v.appendChild(ui.voz);
      }
      const meterWrap = el('div', 'hmeter'); ui.bar = el('div', 'hbar'); ui.mark = el('div', 'hmark'); meterWrap.append(ui.bar, ui.mark);
      const sensRow = el('label', 'hsens'); sensRow.append(el('span', null, 'Sensibilidade'));
      ui.sens = el('input'); ui.sens.type = 'range'; ui.sens.min = '1'; ui.sens.max = '10'; ui.sens.value = String(sens);
      ui.sens.addEventListener('input', () => { sens = +ui.sens.value; det.set(fromSens(sens)); try { localStorage.setItem(SENS_KEY, String(sens)); } catch (_) { /* ignore */ } });
      sensRow.appendChild(ui.sens);
      ui.count = el('div', 'hnote', '');
      const acts = el('div', 'hacts');
      acts.append(btn('Resumo agora', () => runRoutine(), 'sbtn'), btn('Parar', () => stop(), 'sbtn'));
      ui.cards = el('div', 'hcards');
      root.append(rows, meterWrap, sensRow, ui.count, acts, ui.cards);
      ['agenda', 'emails', 'noticias', 'musica'].forEach((k) => { ui['c_' + k] = el('section', 'hcard'); ui.cards.appendChild(ui['c_' + k]); });
      setCard('musica', 'Spotify', ['Nada tocando.']);
      setCard('agenda', 'Agenda', ['Ainda não consultei.']);
      setCard('emails', 'E-mails importantes', ['Ainda não consultei.']);
      setCard('noticias', 'Notícias', ['Ainda não consultei.']);
      refreshStatus();
    }
    function setCard(key, title, lines) {
      const c = ui['c_' + key]; if (!c) return;
      c.replaceChildren(el('h3', null, title));
      const ul = el('ul');
      lines.forEach((ln) => {
        const li = el('li');
        const o = typeof ln === 'string' ? { text: ln } : ln;
        if (o.href) { const a = el('a', null, o.text); a.href = o.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.appendChild(a); }
        else li.appendChild(el('span', null, o.text));
        if (o.sub) li.appendChild(el('small', null, o.sub));
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }
    function status(o, text, label, fn) {
      o.v.textContent = text; o.a.replaceChildren();
      if (label) o.a.appendChild(btn(label, fn));
    }
    function refreshStatus() {
      if (!ui.sp) return;
      if (!sp.configured) status(ui.sp, 'Falta o Client ID', '', null);
      else if (sp.connected) status(ui.sp, 'Conectado', 'Desconectar', () => { sp.disconnect(); refreshStatus(); });
      else status(ui.sp, 'Desconectado', 'Conectar', () => sp.connect().catch(() => api.addMsg('sys', 'Não consegui iniciar a conexão com o Spotify.')));
      if (!api.googleAvailable()) status(ui.gg, 'Indisponível (configure o Firebase)', '', null);
      else if (api.googleToken()) status(ui.gg, 'Conectado (Gmail + Agenda)', '', null);
      else status(ui.gg, 'Desconectado', 'Conectar Google', () => api.connectGoogle().then(refreshStatus).catch(() => api.addMsg('sys', 'Não consegui entrar com o Google agora.')));
      status(ui.cl, mic ? 'Ligadas (' + (pCfg.quantidade || 2) + ' palmas)' : 'Desligadas', mic ? 'Desligar' : 'Ligar', () => (mic ? stopClaps() : startClaps()));
    }

    /* ---------- palmas ---------- */
    function onRms(rms, t) {
      const ev = det.feed(rms, t);
      if (ev === 'clap') { clapCount++; if (ui.count) ui.count.textContent = 'Palmas ouvidas: ' + clapCount; }
      if (ui.bar && t - lastUi > 60 && !document.hidden) {
        lastUi = t;
        ui.bar.style.width = Math.min(100, rms / 0.2 * 100) + '%';
        ui.mark.style.left = Math.min(100, det.threshold() / 0.2 * 100) + '%';
      }
      if (ev === 'trigger' && !api.isSpeaking()) { api.onClapWake(); onDoubleClap(); }
    }
    async function startClaps() {
      if (mic) return true;
      try {
        det.reset();
        mic = await openMic(onRms);
        api.addMsg('sys', 'Palmas ligadas: bata ' + (pCfg.quantidade || 2) + ' palmas para ouvir o resumo e a música.');
        refreshStatus();
        return true;
      } catch (e) {
        mic = null; refreshStatus();
        api.addMsg('sys', 'Não consegui ouvir o microfone para as palmas. Libere o acesso nas permissões do site.');
        return false;
      }
    }
    function stopClaps() { if (mic) { mic.close(); mic = null; } refreshStatus(); }

    /* ---------- dados ---------- */
    function errText(e, what) {
      if (e && e.apiOff) return 'A API do ' + what + ' não está ativada no projeto do Google Cloud. O passo a passo está no LEIA-ME.';
      if (e && e.auth) return 'Para ler ' + (what === 'Gmail' ? 'seus e-mails' : 'sua agenda') + ' preciso da sua autorização do Google. Abra o Painel e toque em Conectar Google.';
      return 'Não consegui acessar ' + (what === 'Gmail' ? 'o Gmail' : what === 'notícias' ? 'as notícias' : 'a agenda') + ' agora.';
    }
    const safe = (p) => p.then((data) => ({ data: data }), (err) => ({ err: err }));
    const getNews = () => safe(fetchNews(nCfg));
    const getAgenda = () => safe(gg.agenda());
    const getEmails = () => safe(gg.emails());

    function paintNews(r) { setCard('noticias', 'Notícias', r.err ? [errText(r.err, 'notícias')] : r.data.map((n) => ({ text: n.title, sub: n.source, href: n.link }))); }
    function paintAgenda(r) {
      if (r.err) return setCard('agenda', 'Agenda', [errText(r.err, 'Agenda')]);
      const f = (e) => ({ text: e.title, sub: e.allDay ? 'o dia todo' : pad(e.start.getHours()) + ':' + pad(e.start.getMinutes()) });
      const L = r.data.hoje.map(f); if (!L.length) L.push('Nada mais hoje.');
      setCard('agenda', 'Agenda', L.concat(r.data.amanha.slice(0, 3).map((e) => { const x = f(e); x.sub = 'amanhã · ' + x.sub; return x; })));
    }
    function paintEmails(r) {
      if (r.err) return setCard('emails', 'E-mails importantes', [errText(r.err, 'Gmail')]);
      const L = r.data.keep.slice(0, rCfg.maxEmails || 5).map((m) => ({ text: cleanSubject(m.subject), sub: cut(m.from, 40) }));
      if (!L.length) L.push('Nenhum importante agora.');
      if (r.data.dropped) L.push({ text: r.data.dropped + ' ignorados (promoções e automáticos)', sub: 'nada foi apagado' });
      setCard('emails', 'E-mails importantes', L);
    }
    const emailsSpoken = (r) => emailsText({ keep: r.keep.slice(0, rCfg.maxEmails || 5), dropped: r.dropped });
    async function paintNow() {
      if (!sp.connected) return;
      try { const n = await sp.nowPlaying(); setCard('musica', 'Spotify', [n ? { text: n.name, sub: n.artists + (n.playing ? ' · tocando' : ' · pausado') } : 'Nada tocando.']); } catch (_) { /* ignore */ }
    }

    /* ---------- rotina ---------- */
    async function runRoutine() {
      if (running) return;
      running = true; aborted = false;
      const duck = sCfg.volumeFundo != null ? sCfg.volumeFundo : 30, back = sCfg.volume != null ? sCfg.volume : 70;
      let music = false;
      try {
        api.addMsg('sys', 'Rotina iniciada.');
        const jobs = { noticias: getNews(), agenda: getAgenda(), emails: getEmails() }; // busca tudo em paralelo
        if (sp.connected) {
          try { await sp.playConfig(); music = true; await sleep(700); await sp.setVolume(duck); paintNow(); }
          catch (e) { api.addMsg('sys', spErr(e)); }
        }
        await api.say(greetWord() + (api.userName() ? ', ' + api.userName() : '') + '. Aqui está o seu resumo.');
        const order = rCfg.ordem || ['noticias', 'agenda', 'emails'];
        for (let i = 0; i < order.length && !aborted; i++) {
          const k = order[i]; if (!jobs[k]) continue;
          const r = await jobs[k];
          let text;
          if (k === 'noticias') { paintNews(r); text = r.err ? errText(r.err, 'notícias') : newsText(r.data); }
          else if (k === 'agenda') { paintAgenda(r); text = r.err ? errText(r.err, 'Agenda') : agendaText(r.data); }
          else { paintEmails(r); text = r.err ? errText(r.err, 'Gmail') : emailsSpoken(r.data); }
          if (!aborted) await api.say(text);
        }
        if (!aborted) await api.say('Fim do resumo.');
      } finally {
        running = false;
        if (music) sp.setVolume(back);
      }
    }
    function stop() { aborted = true; api.stopSpeaking(); if (sp.connected) sp.setVolume(sCfg.volume != null ? sCfg.volume : 70); }
    async function onDoubleClap() {
      if (running) { stop(); return; }
      let playing = false;
      if (sp.connected && !rCfg.sempreResumo) { try { const st = await sp.state(); playing = !!(st && st.is_playing); } catch (_) { /* ignore */ } }
      if (playing) { await sp.pause(); api.addMsg('sys', 'Música pausada.'); paintNow(); }
      else runRoutine();
    }

    /* ---------- comandos de voz ---------- */
    function spErr(e) {
      if (e && e.spotify && !sp.connected) return 'O Spotify não está conectado. Abra o Painel e toque em Conectar.';
      if (e && e.nodevice) return 'Não achei nenhum aparelho com Spotify aberto. Abra o app do Spotify no celular ou no computador, ou use o Chrome com Premium.';
      if (e && (e.status === 403 || /PREMIUM/.test(e.reason || ''))) return 'O Spotify recusou o comando. Controlar a reprodução exige conta Premium.';
      return 'Não consegui falar com o Spotify agora.';
    }
    const needSp = () => (!sp.configured ? 'O Spotify ainda não foi configurado: falta o Client ID no firebase-config.js.' : !sp.connected ? 'O Spotify não está conectado. Abra o Painel e toque em Conectar.' : null);
    async function viaSp(fn) { const m = needSp(); if (m) return m; try { return await fn(); } catch (e) { return spErr(e); } }

    async function handle(n, raw) {
      let m;
      if (/^(pare|chega|cancela o resumo)\b|\b(pare|para) (o resumo|a leitura|de falar)\b/.test(n)) { stop(); return running ? 'Parando.' : 'Certo.'; }
      if (/\b(resumo do dia|resumo da manha|meu resumo|me de o resumo|briefing|me atualiza\w*|rotina da manha|bom dia fhinix resumo)\b/.test(n)) { runRoutine(); return 'Iniciando o resumo.'; }
      if (/\b(noticias?|manchetes?)\b/.test(n)) { const r = await getNews(); paintNews(r); return r.err ? errText(r.err, 'notícias') : newsText(r.data); }
      if (/\b(reunioes|reuniao|agenda|compromissos?|calendario)\b/.test(n)) { const r = await getAgenda(); paintAgenda(r); return r.err ? errText(r.err, 'Agenda') : agendaText(r.data); }
      if (/\be-?mails?\b|\bgmail\b|\bcaixa de entrada\b/.test(n)) { const r = await getEmails(); paintEmails(r); return r.err ? errText(r.err, 'Gmail') : emailsSpoken(r.data); }

      if (/\b(pausa|pausar|pause)\b|\b(pare|para|parar|desliga) (a )?musica\b/.test(n)) return viaSp(async () => { await sp.pause(); return 'Música pausada.'; });
      if (/\b(continua|continuar|retoma|retomar|despausar)\b|^(toque|toca|tocar|coloque|coloca) (uma |a )?(musica|som|spotify)$/.test(n)) return viaSp(async () => { await (n.includes('musica') || n.includes('spotify') || n.includes('som') ? sp.playConfig() : sp.resume()); return 'Tocando.'; });
      if (/\b(proxima|pula|pular|avanca)\b/.test(n)) return viaSp(async () => { await sp.next(); return 'Próxima.'; });
      if (/\b(anterior|voltar musica|volta a musica)\b/.test(n)) return viaSp(async () => { await sp.prev(); return 'Voltando.'; });
      if ((m = /\bvolume\b.*?\b(\d{1,3})\b/.exec(n))) return viaSp(async () => { await sp.setVolume(+m[1]); return 'Volume em ' + Math.min(100, +m[1]) + '.'; });
      if (/\b(aumenta|aumentar|sobe|subir)\b.*\bvolume\b|\bvolume (mais )?alto\b/.test(n)) return viaSp(async () => 'Volume em ' + (await sp.changeVolume(15)) + '.');
      if (/\b(abaixa|abaixar|diminui|diminuir|baixa|baixar)\b.*\bvolume\b|\bvolume (mais )?baixo\b/.test(n)) return viaSp(async () => 'Volume em ' + (await sp.changeVolume(-15)) + '.');
      if (/\bo que (esta |ta )?tocando\b|\bque musica (e )?essa\b|\bqual (e )?a musica\b/.test(n)) return viaSp(async () => { const t = await sp.nowPlaying(); paintNow(); return t ? t.name + ', de ' + t.artists + (t.playing ? '.' : ' (pausado).') : 'Nada está tocando.'; });
      if ((m = /^(?:toque|toca|tocar|coloque|coloca|ponha|poe|reproduza)\s+(.+)$/.exec(n))) {
        const q = m[1].replace(/\s+(no|pelo|na) spotify$/, '').trim();
        if (q.length > 1) return viaSp(async () => { const name = await sp.playQuery(q); paintNow(); return name ? 'Tocando ' + name + '.' : 'Não encontrei nada no Spotify para “' + q + '”.'; });
      }
      return null;
    }

    sp.handleRedirect().then(() => { refreshStatus(); paintNow(); });
    build();
    setInterval(refreshStatus, 30000);

    return {
      handle: handle, runRoutine: runRoutine, stop: stop, startClaps: startClaps, stopClaps: stopClaps, onDoubleClap: onDoubleClap,
      prime: () => sp.prime(), refreshStatus: refreshStatus, spotify: sp, get claps() { return !!mic; }
    };
  }

  window.FhinixHub = {
    create: create,
    _test: { ClapDetector: ClapDetector, fromSens: fromSens, scoreEmail: scoreEmail, triage: triage, normMsg: normMsg, parseFrom: parseFrom, cleanSubject: cleanSubject, splitTitle: splitTitle, emailsText: emailsText, agendaText: agendaText, newsText: newsText, spokenTime: spokenTime, safeUrl: safeUrl }
  };
})();

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('fx');
  const ctx = cv.getContext('2d');
  const intro = $('intro'), cons = $('console'), cwrap = $('cwrap'), slot = $('coreSlot');
  const logo = $('logo'), tagEl = $('tagline'), skipBtn = $('skip'), startBtn = $('start'), replayBtn = $('replay'), boot = $('boot');
  const voiceStart = $('voiceStart'), hint = $('hint'), caption = $('caption');
  const pill = $('pill'), stateTxt = $('stateTxt'), rdSys = $('rdSys'), rdMem = $('rdMem'), rdMode = $('rdMode');
  const msgs = $('msgs'), input = $('input'), composer = $('composer'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');
  const listenBtn = $('listenBtn'), voiceBtn = $('voiceBtn'), introBtn = $('introBtn'), authBtn = $('authBtn');
  const modeBtn = $('modeBtn'), clearBtn = $('clearBtn'), quick = $('quick');
  const memForm = $('memForm'), memInput = $('memInput'), memSave = $('memSave'), memNote = $('memNote'), memList = $('memList'), memCount = $('memCount');
  const tabChat = $('tabChat'), tabMem = $('tabMem'), tabHub = $('tabHub');
  const clapBtn = $('clapBtn'), vHub = $('vHub'), vMem = $('vMem'), viewHub = $('viewHub'), viewMem = $('viewMem');

  const TAU = Math.PI * 2;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (x) => x * x * (3 - 2 * x);
  const deg = (d) => d * Math.PI / 180;
  const rgba = (c, al) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (c[3] * al).toFixed(3) + ')';
  const mix = (a, b, m) => a.map((v, i) => v + (b[i] - v) * m);
  const pad = (n) => String(n).padStart(2, '0');
  const normalize = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ================= phoenix engine ================= */
  const WING_A = [[255, 240, 184, 0.55], [255, 176, 56, 0.46], [240, 86, 28, 0.34], [140, 20, 60, 0]];
  const WING_B = [[255, 205, 140, 0.5], [255, 110, 40, 0.44], [214, 34, 40, 0.36], [120, 10, 90, 0]];
  const WING_PALS = Array.from({ length: 12 }, (_, i) => WING_A.map((c, k) => mix(c, WING_B[k], i / 11)));
  const PAL_INNER = [[255, 252, 222, 0.6], [255, 214, 100, 0.5], [255, 132, 36, 0.3], [210, 50, 24, 0]];
  const PAL_TAIL = [[255, 230, 160, 0.52], [255, 160, 40, 0.42], [236, 56, 30, 0.34], [100, 12, 80, 0]];

  function makeSprite(h) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'hsla(' + h + ',100%,92%,1)');
    gr.addColorStop(0.25, 'hsla(' + h + ',100%,62%,0.85)');
    gr.addColorStop(0.6, 'hsla(' + h + ',100%,48%,0.25)');
    gr.addColorStop(1, 'hsla(' + h + ',100%,40%,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  const SPR = [16, 28, 40, 50].map(makeSprite);

  let W = 0, H = 0, dpr = 1;
  let cx = 0, cy = 0, S = 1, R = 300;
  const tgt = { cx: 0, cy: 0, S: 1, R: 300 };
  let mode = 'intro';
  let frozen = false;
  let ph = 0, hph = 0, energy = 1, energyT = 1;
  const FROZEN_T = 5, FROZEN_PH = 3.6, FROZEN_HPH = 5;
  const parts = [], gather = [], dust = [];
  let tips = [];

  function retarget() {
    if (mode === 'console') {
      const r = slot.getBoundingClientRect();
      if (r.width > 20 && r.height > 20) {
        tgt.S = Math.min(r.width / 600, r.height / 520);
        tgt.cx = r.left + r.width / 2;
        tgt.cy = r.top + r.height * 0.4;
        tgt.R = Math.min(r.width, r.height) * 0.5;
        return;
      }
    }
    tgt.cx = W / 2;
    tgt.cy = H * 0.38;
    tgt.S = Math.min(W / 560, (H * 0.62) / 560);
    tgt.R = Math.min(W * 0.47, tgt.cy * 0.95, (H - tgt.cy) * 0.9);
  }
  function snap() { retarget(); cx = tgt.cx; cy = tgt.cy; S = tgt.S; R = tgt.R; }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    snap();
    if (frozen) draw(FROZEN_T);
  }

  function initGather() {
    gather.length = 0;
    for (let i = 0; i < 420; i++) {
      gather.push({ r0: 0.55 + Math.random() * 0.9, a0: Math.random() * TAU, sp: 2.2 + Math.random() * 1.6, sz: 0.8 + Math.random() * 1.8, h: 22 + Math.random() * 28 });
    }
  }
  function initDust() {
    dust.length = 0;
    for (let i = 0; i < 70; i++) {
      dust.push({ x: Math.random(), y: Math.random(), v: 0.01 + Math.random() * 0.03, sz: 0.6 + Math.random() * 1.2, ph: Math.random() * TAU, s: Math.floor(Math.random() * 4) });
    }
  }

  function toWorld(x, y) {
    const m = ctx.getTransform();
    return [(m.a * x + m.c * y + m.e) / dpr, (m.b * x + m.d * y + m.f) / dpr];
  }

  function feather(x0, y0, th, L, wd, bend, wave, wf, seed, t, pal, al, glow) {
    if (L < 2) return;
    const K = 18, st = L / K;
    const px = [x0], py = [y0], pa = [th];
    let x = x0, y = y0;
    for (let k = 1; k <= K; k++) {
      const u = k / K;
      const a = th + bend * u + Math.sin(t - u * wf + seed) * wave * u;
      x += Math.cos(a) * st; y += Math.sin(a) * st;
      px.push(x); py.push(y); pa.push(a);
    }
    const fl = 0.88 + 0.12 * Math.sin(t * 1.3 + seed * 2.3);
    const A = al * fl * (glow ? 0.2 : 1);
    const wmax = wd * (glow ? 2.6 : 1);
    const sh = [], nx = [], ny = [];
    for (let k = 0; k <= K; k++) {
      const u = k / K;
      sh.push(wmax * Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(u, 0.7))), 0.85));
      nx.push(-Math.sin(pa[k])); ny.push(Math.cos(pa[k]));
    }
    ctx.beginPath();
    ctx.moveTo(px[0] + nx[0] * sh[0], py[0] + ny[0] * sh[0]);
    for (let k = 1; k <= K; k++) ctx.lineTo(px[k] + nx[k] * sh[k], py[k] + ny[k] * sh[k]);
    for (let k = K; k >= 0; k--) ctx.lineTo(px[k] - nx[k] * sh[k], py[k] - ny[k] * sh[k]);
    ctx.closePath();
    const g = ctx.createLinearGradient(x0, y0, x, y);
    g.addColorStop(0, rgba(pal[0], A));
    g.addColorStop(0.35, rgba(pal[1], A));
    g.addColorStop(0.72, rgba(pal[2], A));
    g.addColorStop(1, rgba(pal[3], A));
    ctx.fillStyle = g;
    ctx.fill();
    if (glow) return;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(px[0], py[0]);
    for (let k = 1; k <= K; k++) ctx.lineTo(px[k], py[k]);
    ctx.strokeStyle = 'rgba(255,238,200,' + (0.3 * al * fl).toFixed(3) + ')';
    ctx.stroke();
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    const sides = [0.5, -0.5];
    for (let s = 0; s < 2; s++) {
      ctx.moveTo(px[1] + nx[1] * sh[1] * sides[s], py[1] + ny[1] * sh[1] * sides[s]);
      for (let k = 2; k < K; k++) ctx.lineTo(px[k] + nx[k] * sh[k] * sides[s], py[k] + ny[k] * sh[k] * sides[s]);
    }
    ctx.strokeStyle = 'rgba(255,214,150,' + (0.14 * al * fl).toFixed(3) + ')';
    ctx.stroke();
    tips.push(toWorld(x, y));
  }

  function wing(t, e, flap, glow) {
    const N = 12;
    for (let layer = 0; layer < 3; layer++) {
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const th = deg(-78 + u * 100) + flap * 0.3;
        const Lb = 70 + 190 * Math.sin(Math.PI * (0.08 + 0.75 * u));
        const L = Lb * e * (layer === 0 ? 1 : layer === 1 ? 0.52 : 0.28);
        const wd = layer === 0 ? 11 : layer === 1 ? 7 : 5;
        const bend = 0.28 + 0.25 * u - flap * 0.25;
        const off = layer === 0 ? 0 : layer === 1 ? 0.05 : 0.1;
        feather(14, -8, th + off, L, wd, bend, 0.1, 1.6, i * 0.7 + layer, t, layer === 0 ? WING_PALS[i] : PAL_INNER, e, glow);
      }
    }
  }
  function tail(t, e, glow) {
    for (let j = 0; j < 7; j++) {
      const th = deg(90 + (j - 3) * 8);
      const L = (250 - Math.abs(j - 3) * 24) * e;
      const bend = Math.sin(t * 0.58 + j * 0.6) * 0.7;
      feather(0, 26, th, L, 9, bend, 0.35, 5, j * 0.9, t, PAL_TAIL, e, glow);
    }
  }
  function crest(t, e, glow) {
    const defs = [[-90, 78, 0], [-112, 58, -0.5], [-68, 58, 0.5]];
    for (let i = 0; i < defs.length; i++) {
      feather(0, -54, deg(defs[i][0]), defs[i][1] * e, 5, defs[i][2], 0.25, 3, i, t, PAL_INNER, e, glow);
    }
  }

  function rays(e, gi) {
    const len = 430;
    ctx.save();
    ctx.translate(0, -6);
    ctx.rotate(hph * 0.12);
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, len);
    g.addColorStop(0, 'rgba(255,170,60,' + (0.16 * e * gi).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,110,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, w = 0.045 + 0.02 * Math.sin(hph * 0.8 + i * 2.1);
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a - w) * len, Math.sin(a - w) * len);
      ctx.lineTo(Math.cos(a + w) * len, Math.sin(a + w) * len);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }

  function bodyAndHead(t, e, gi) {
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(0, -10, 2, 0, -6, 46);
    g.addColorStop(0, '#fff6dc'); g.addColorStop(0.35, '#ffc45a'); g.addColorStop(0.75, '#ff6a1a'); g.addColorStop(1, '#a3170c');
    ctx.globalAlpha = e;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -36);
    ctx.bezierCurveTo(18, -26, 18, 10, 0, 44);
    ctx.bezierCurveTo(-18, 10, -18, -26, 0, -36);
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -47, 10, 12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffa526';
    ctx.beginPath();
    ctx.moveTo(-4.5, -41); ctx.quadraticCurveTo(0, -31, 0, -25); ctx.quadraticCurveTo(0, -31, 4.5, -41);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a0d05';
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath(); ctx.moveTo(s * 7.5, -50); ctx.lineTo(s * 2, -46.5); ctx.lineTo(s * 6.5, -45); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,250,225,' + (0.9 * e).toFixed(3) + ')';
    for (let s = -1; s <= 1; s += 2) { ctx.beginPath(); ctx.arc(s * 4.2, -46.8, 1.1, 0, TAU); ctx.fill(); }
    const pulse = 0.85 + 0.15 * Math.sin(t * 1.25);
    const rr = 30 * pulse * (0.9 + 0.1 * gi);
    const cg = ctx.createRadialGradient(0, -6, 0, 0, -6, rr);
    cg.addColorStop(0, 'rgba(255,255,240,' + (0.95 * e).toFixed(3) + ')');
    cg.addColorStop(0.35, 'rgba(255,200,100,' + (0.55 * e).toFixed(3) + ')');
    cg.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, -6, rr, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,244,210,' + (0.6 * e).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, -6, 13, 0, TAU); ctx.stroke();
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const a = k * TAU / 3 + hph * 0.6;
      ctx.moveTo(Math.cos(a) * 15, -6 + Math.sin(a) * 15);
      ctx.lineTo(Math.cos(a) * 20, -6 + Math.sin(a) * 20);
    }
    ctx.stroke();
  }

  function drawPhoenix(e) {
    const gi = 0.85 + 0.2 * energy;
    const flap = Math.sin(ph);
    const bob = frozen ? 0 : Math.sin(ph * 0.5) * 7;
    const sc = S * (0.35 + 0.65 * e);
    ctx.save();
    ctx.translate(cx, cy + bob * S + (1 - e) * 40 * S);
    ctx.scale(sc, sc);
    ctx.globalCompositeOperation = 'lighter';
    rays(e, gi);
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 340);
    gl.addColorStop(0, 'rgba(255,120,30,' + (0.26 * e * gi).toFixed(3) + ')');
    gl.addColorStop(0.5, 'rgba(230,60,20,' + (0.1 * e * gi).toFixed(3) + ')');
    gl.addColorStop(1, 'rgba(200,40,20,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, 340, 0, TAU); ctx.fill();
    const passes = [true, false];
    for (let p = 0; p < 2; p++) {
      const glow = passes[p];
      tail(ph, e, glow);
      for (let s = -1; s <= 1; s += 2) {
        ctx.save();
        ctx.scale(s, 1);
        wing(ph, e, flap, glow);
        ctx.restore();
      }
      crest(ph, e, glow);
    }
    bodyAndHead(ph, e, gi);
    ctx.restore();
  }

  function hud(T) {
    const ha = clamp(T / 1.2);
    const sc = 0.7 + 0.3 * ease(clamp(T / 1.4));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);
    ctx.globalAlpha = ha;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,190,90,0.3)';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();

    ctx.save();
    ctx.rotate(hph * 0.07);
    const nt = R < 110 ? 60 : 120;
    ctx.beginPath();
    for (let i = 0; i < nt; i++) {
      const a = i / nt * TAU, long = i % 10 === 0, mid = i % 5 === 0;
      const r1 = R - (long ? 15 : mid ? 10 : 5);
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
    }
    ctx.strokeStyle = 'rgba(255,200,110,0.34)';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.rotate(-hph * 0.13);
    ctx.setLineDash([2, 9]);
    ctx.strokeStyle = 'rgba(255,190,90,0.38)';
    ctx.beginPath(); ctx.arc(0, 0, R * 0.9, 0, TAU); ctx.stroke();
    ctx.restore();

    ctx.setLineDash([]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,150,40,0.5)';
    for (let k = 0; k < 3; k++) {
      const a0 = k * TAU / 3 + hph * 0.4;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.8, a0, a0 + 0.7); ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(111,216,255,0.42)';
    for (let k = 0; k < 4; k++) {
      const a0 = k * TAU / 4 - hph * 0.3;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.72, a0, a0 + 0.5); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,214,150,0.5)';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2;
      ctx.moveTo(Math.cos(a) * R * 1.02, Math.sin(a) * R * 1.02);
      ctx.lineTo(Math.cos(a) * R * 1.1, Math.sin(a) * R * 1.1);
    }
    ctx.stroke();
    ctx.restore();
  }

  function ember(x, y) {
    const max = 1.2 + Math.random() * 1.2;
    parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * 30 * S, vy: -(20 + Math.random() * 70) * S, life: max, max: max, sz: 1 + Math.random() * 1.6, s: Math.floor(Math.random() * 4), drag: false });
  }
  function burst() {
    for (let i = 0; i < 380; i++) {
      const a = Math.random() * TAU, sp = (60 + Math.random() * 520) * S, max = 1 + Math.random() * 1.4;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: max, max: max, sz: 1 + Math.random() * 2.2, s: Math.floor(Math.random() * 4), drag: true });
    }
  }
  function update(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.drag) { const d = Math.pow(0.1, dt); p.vx *= d; p.vy *= d; }
      else { p.vx += (Math.random() - 0.5) * 70 * dt; p.vy -= 16 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.y -= d.v * dt;
      if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
    }
  }

  function draw(T) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#07060a';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const sz = d.sz * 4;
      ctx.globalAlpha = 0.18 + 0.12 * Math.sin(hph + d.ph);
      ctx.drawImage(SPR[d.s], d.x * W + Math.sin(hph * 0.6 + d.ph) * 14 - sz, d.y * H - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;

    hud(T);
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    const k = clamp(T / 1.6);
    if (T < 1.65 && !frozen) {
      const spark = 4 + 26 * k * S + 3 * Math.sin(T * 14);
      const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, spark * 2.4);
      sg.addColorStop(0, 'rgba(255,250,225,' + (0.5 + 0.5 * k).toFixed(3) + ')');
      sg.addColorStop(0.4, 'rgba(255,170,60,' + (0.4 * (0.4 + k)).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(255,100,20,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(cx, cy, spark * 2.4, 0, TAU); ctx.fill();
      const pos = (g, Tt) => {
        const kk = clamp(Tt / 1.6);
        const r = g.r0 * R * Math.pow(1 - kk, 1.6);
        const a = g.a0 + g.sp * Tt * (1 + kk * 2);
        return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
      };
      for (let i = 0; i < gather.length; i++) {
        const g = gather[i];
        const a = pos(g, Math.max(0, T - 0.05)), b = pos(g, T);
        ctx.strokeStyle = 'hsla(' + g.h.toFixed(0) + ',100%,66%,' + (0.15 + 0.7 * k).toFixed(3) + ')';
        ctx.lineWidth = g.sz;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }

    tips = [];
    const rise = clamp((T - 1.5) / 2.4);
    const e = 1 - Math.pow(1 - rise, 3);
    if (e > 0.001) drawPhoenix(e);

    if (!frozen && e > 0.55) {
      const pr = 0.1 * (0.7 + 0.4 * energy);
      for (let i = 0; i < tips.length; i++) {
        if (Math.random() < pr && parts.length < 1100) ember(tips[i][0], tips[i][1]);
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const kk = p.life / p.max;
      const sz = p.sz * 3.4 * (0.5 + kk * 0.7);
      ctx.globalAlpha = Math.min(1, kk * 1.3) * 0.9;
      ctx.drawImage(SPR[p.s], p.x - sz, p.y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;

    if (T >= 1.6 && T < 2.6) {
      const q = (T - 1.6) / 1.0;
      ctx.strokeStyle = 'rgba(255,200,110,' + (0.7 * (1 - q)).toFixed(3) + ')';
      ctx.lineWidth = 2 + 8 * (1 - q);
      ctx.beginPath(); ctx.arc(cx, cy, q * R * 1.5, 0, TAU); ctx.stroke();
    }
    if (T >= 1.6 && T < 1.95) {
      ctx.fillStyle = 'rgba(255,232,185,' + (0.55 * (1 - (T - 1.6) / 0.35)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);

    for (let i = 0; i < timeline.length; i++) {
      if (!timeline[i].done && T >= timeline[i].t) { timeline[i].done = true; timeline[i].fn(); }
    }
    if (!burstDone && T >= 1.6) { burstDone = true; burst(); }
    retarget();
    const a = 1 - Math.exp(-dt * 4.5);
    cx += (tgt.cx - cx) * a; cy += (tgt.cy - cy) * a; S += (tgt.S - S) * a; R += (tgt.R - R) * a;

    ph += dt * 2.4 * (0.75 + 0.35 * energy);
    hph += dt * (0.6 + 0.4 * energy);
    update(dt);
    draw(T);
    requestAnimationFrame(frame);
